name: Nightly Coraza Check
on:
  pull_request:
    paths:
      - ".github/workflows/nightly-coraza-check.yaml"
      - ".github/workflows/ci.yaml"
  schedule:
    - cron: "0 4 * * *"

env:
  # Ahead of ci.yaml's 1.25 on purpose: this canary tracks coraza@main, whose
  # deps (kaptinlin/go-i18n, kaptinlin/jsonschema) now floor at go 1.26.5, so
  # go mod tidy fails on 1.25. The pinned CI stays on 1.25 with coraza v3.7.0.
  GO_VERSION: "1.26"
  # Keep in sync with ci.yaml — TinyGo 0.39.x pinned (0.40/0.41 break under wazero).
  TINYGO_VERSION: "0.39.0"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install tinygo
        uses: acifani/setup-tinygo@v1
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}

      - name: Get last commit of coraza
        id: coraza-latest-commit
        run: echo "value=$(gh api repos/corazawaf/coraza/commits/main -q .sha)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch last coraza version
        run: go get -u github.com/corazawaf/coraza/v3@${{ steps.coraza-latest-commit.outputs.value }} && go mod tidy

      - name: Build binary
        run: go run mage.go build

      - name: Run tests
        run: go run mage.go test

      - name: Run e2e tests
        run: go run mage.go e2e

      - name: Run FTW tests
        run: go run mage.go ftw
