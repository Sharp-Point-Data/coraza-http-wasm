name: Nightly Coraza Check
on:
  pull_request:
    paths:
      - ".github/workflows/nightly-coraza-check.yaml"
      - ".github/workflows/ci.yaml"
  schedule:
    - cron: "0 4 * * *"

env:
  # Ahead of ci.yaml's 1.25 on purpose, and capped at the top of TinyGo 0.41.1's
  # supported range (its builder/config.go sets minorMax = 26). Go 1.27.0 is out
  # but no TinyGo release accepts it yet - that support sits on TinyGo's
  # unreleased dev branch - so raising this only moves the failure from tidy to
  # the build step. Revisit when TinyGo 0.42 ships.
  GO_VERSION: "1.26"
  # Deliberately ahead of ci.yaml's 0.39.0: TinyGo 0.41.0+ is the first release
  # that supports Go 1.26, which coraza@main now requires. 0.41 crashed under
  # wazero at instantiation in earlier tests, but those predated the 8MB-stack
  # ldflags fix in wasip1-8mb-stack.json — this canary is the retest. If it
  # builds and passes FTW, it's the green light to bump the pinned CI too.
  TINYGO_VERSION: "0.41.1"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install tinygo
        uses: acifani/setup-tinygo@v1
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}

      - name: Get last commit of coraza
        id: coraza-latest-commit
        run: echo "value=$(gh api repos/corazawaf/coraza/commits/main -q .sha)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No -u here on purpose: it upgraded the entire module graph to latest
      # rather than just coraza, which is how kaptinlin/jsonschema v0.9.9
      # (go >= 1.27, tagged 2026-08-27) started failing this job on 2026-08-28.
      # coraza@main itself declares go 1.25.0 and pins jsonschema v0.4.6, so a
      # plain go get + MVS keeps the canary testing coraza@main instead of every
      # transitive dependency at its bleeding edge.
      - name: Fetch last coraza version
        run: go get github.com/corazawaf/coraza/v3@${{ steps.coraza-latest-commit.outputs.value }} && go mod tidy

      - name: Build binary
        run: go run mage.go build

      - name: Run tests
        run: go run mage.go test

      - name: Run e2e tests
        run: go run mage.go e2e

      - name: Run FTW tests
        run: go run mage.go ftw
