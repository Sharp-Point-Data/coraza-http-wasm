name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  # Lets the full build + FTW suite be re-run on demand. Without it the only
  # triggers are a push to main and a tag, so re-validating an unchanged tree
  # (e.g. after a toolchain or upstream-dependency change) needs a dummy commit.
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  # TinyGo 0.39.x is pinned deliberately: 0.40/0.41 guests crash under wazero
  # at instantiation (OOB in runtime.initAll). Re-test before bumping.
  TINYGO_VERSION: "0.39.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install tinygo
        uses: acifani/setup-tinygo@v1
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}

      - name: Build wasm binary
        run: go run mage.go build

      - name: Run tests
        run: go run mage.go test

      - name: Run E2E tests
        run: go run mage.go e2e

      - name: Run FTW tests
        run: go run mage.go ftw

      - name: Create draft release
        # Triggered only on tag creation and if release does not exist
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          set +e
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view ${tag}; then
            echo "Release ${tag} does not exist, creating..."
            gh release create ${tag} --draft --title ${GITHUB_REF#refs/tags/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push build artifact to release
        # Triggered only on tag creation.
        #
        # The zip is a self-contained Traefik plugin bundle: .traefik.yml next
        # to the wasm it names in wasmPath, packed flat (-j). Consumers unpack
        # it into one directory and point Traefik at that directory. Ours is
        # the Maestro3 monorepo, which downloads this asset by tag, verifies it
        # against the checksums file below, and bakes it into the
        # coraza-http-wasm image that Traefik loads via
        # experimental.localPlugins. The checksums are the integrity gate
        # between a merge here and the wasm reaching the cluster, so they are
        # published as a separate asset rather than computed at consume time.
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          zip -j build/coraza-http-wasm-${tag}.zip .traefik.yml build/coraza-http-wasm.wasm LICENSE
          # Checksum both the bundle and the bare wasm: consumers verify the
          # zip, humans comparing a local build verify the wasm.
          (cd build && sha256sum "coraza-http-wasm-${tag}.zip" coraza-http-wasm.wasm \
            > "coraza-http-wasm-${tag}-checksums.txt")
          gh release upload ${tag} \
            "./build/coraza-http-wasm-${tag}.zip" \
            "./build/coraza-http-wasm-${tag}-checksums.txt" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Public registry, but still gated to tag pushes: no reason to publish
        # an image for every commit to main.
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        # ghcr.io requires a lowercase path; github.repository preserves the
        # org's actual casing (Sharp-Point-Data), so lowercase it explicitly
        # rather than relying on callers to know that quirk.
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push -t "${image}:${tag}" -t "${image}:latest" .
